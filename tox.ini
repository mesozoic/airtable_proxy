[tox]
isolated_build = true
envlist =
    py311
    pre-commit

[testenv:pre-commit]
deps = pre-commit
commands =
    pre-commit install --install-hooks
    pre-commit run --all-files

[testenv:py311]
passenv = AIRTABLE_API_KEY
testpaths = tests
allowlist_externals = poetry
commands_pre =
    poetry install --no-root --sync
commands =
    poetry run mypy --strict -p airtable_proxy
    poetry run python -m pytest {posargs}

[flake8]
filename = *.py
count = True
# See https://black.readthedocs.io/en/stable/the_black_code_style/current_style.html
ignore = E203, E231, E266, E501, W503
select = B,C,E,F,W,T4,B9
max-line-length = 88
max-complexity = 15
exclude =
    .venv
    .eggs
    .tox
    ./docs
