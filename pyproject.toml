[tool.poetry]
name = "airtable_proxy"
version = "0.1.0"
description = ""
authors = ["Alex Levy <mesozoic@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "airtable_proxy", from = "src"}]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115"
pyairtable = "^3.0.2"
pyyaml = "^6.0"
uvicorn = {extras = ["standard"], version = "^0.34"}
httpx = "^0.28"

[tool.poetry.group.dev.dependencies]
httpx = "^0.28"
mypy = "^1.19.1"
pytest = "^7.4.4"
pytest-cov = "^6.3.0"
pytest-vcr = "^1.0.2"
requests-mock = "^1.12.1"
types-pyyaml = "^6.0"
types-requests = "^2.32.4.20260107"
ruff = "^0.9"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (require AIRTABLE_API_KEY)",
]
python_files = ["test_*.py", "*_test.py", "itest_*.py"]
addopts = "--cov --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 101

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
